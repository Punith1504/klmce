apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    app: klmce-frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: klmce-frontend
  template:
    metadata:
      labels:
        app: klmce-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.frontend.env.nextPublicApiUrl | quote }}
          # Air-gapped Survivability Note:
          # Next.js font optimization (next/font) automatically downloads Google Fonts 
          # at build time and bundles them locally. At runtime, this container makes 
          # ZERO outbound network requests to public CDNs, guaranteeing survival in 
          # 100% disconnected on-premise environments.
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: klmce-frontend
