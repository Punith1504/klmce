apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: klmce-prod
data:
  pgbouncer.ini: |
    [databases]
    # Route all klmce_erp traffic to the physical Postgres StatefulSet
    klmce_erp = host=postgres-master-svc port=5432 dbname=klmce_erp
    
    [pgbouncer]
    listen_port = 6432
    listen_addr = *
    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt
    
    # CRITICAL: Transaction pooling multiplexes thousands of microservice 
    # requests down to a handful of physical connections.
    pool_mode = transaction
    max_client_conn = 10000
    default_pool_size = 80
    reserve_pool_size = 20
    
    # Connection sanity checks
    server_reset_query = DISCARD ALL
    server_check_query = select 1
    server_check_delay = 30
    
  userlist.txt: |
    "postgres" "md5passwordhash"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: klmce-prod
spec:
  replicas: 2 # Highly Available PgBouncer cluster
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
      - name: pgbouncer
        image: edoburu/pgbouncer:latest
        ports:
        - containerPort: 6432
        resources:
          requests:
            cpu: "200m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        volumeMounts:
        - name: config-volume
          mountPath: /etc/pgbouncer
      volumes:
      - name: config-volume
        configMap:
          name: pgbouncer-config

---
apiVersion: v1
kind: Service
metadata:
  name: db-pool-svc
  namespace: klmce-prod
spec:
  selector:
    app: pgbouncer
  ports:
  - port: 5432
    targetPort: 6432
