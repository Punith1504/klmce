apiVersion: apps/v1
kind: Deployment
metadata:
  name: klmce-frontend
  namespace: klmce-prod
spec:
  selector:
    matchLabels:
      app: klmce-frontend
  template:
    metadata:
      labels:
        app: klmce-frontend
    spec:
      containers:
      - name: nextjs
        image: ghcr.io/klmce/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.klmce.edu"
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: klmce-prod
spec:
  selector:
    app: klmce-frontend
  ports:
  - port: 80
    targetPort: 3000

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: klmce-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: klmce-frontend
  minReplicas: 2
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
