name: ERP verification
on:
  push:
    branches: [fix/erp-security-foundation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:audit
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: erp_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd 'redis-cli ping' --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgresql://postgres:integration-only@localhost:5432/erp_test
      DATABASE_URL: postgresql://erp_test:integration-only@localhost:5432/erp_test
      REDIS_URL: redis://localhost:6379/0
      ERP_DISPOSABLE_TEST_DB: '1'
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/audit/requirements.txt
      - run: pip install -r tests/audit/requirements.txt
      - run: pytest tests/audit tests/integration -v --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: test-results.xml
